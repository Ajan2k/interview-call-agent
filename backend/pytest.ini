[pytest]
# asyncio_mode=auto lets us write `async def test_...` without decorating each one.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
markers =
    integration: end-to-end tests that spin up the FastAPI app via TestClient
    unit: fast, isolated tests of a single function
